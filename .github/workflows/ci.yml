name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npx tsc --noEmit

      - name: Next.js Production Build Test
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sbp_placeholder_for_ci_build"

  backend-ci:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uvx ruff check .

      - name: Run Mypy Type Checker
        run: uvx mypy --ignore-missing-imports app
        continue-on-error: true # Will become strict once backend source files are populated
