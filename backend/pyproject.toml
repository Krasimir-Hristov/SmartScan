[project]
name = "backend"
version = "0.1.0"
description = "Smart Scan Backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "supabase>=2.6.0",
    "python-dotenv>=1.0.1",
    "langchain",
    "langgraph",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.18",
    "stripe>=10.0.0",
]

[tool.ruff]
# Run Ruff from `backend/` (or point the editor at this config) so `app` is
# classified as first-party. Without this, the editor resolves the workspace
# root and mis-detects `app.*` as third-party, producing false I001 import
# ordering warnings on files whose imports are already correctly grouped.
line-length = 88

[tool.ruff.lint]
# Matches the ruleset the project linted against before this file existed:
# import sorting (I) and flake8-simplify (SIM), plus the always-on E/F defaults.
select = ["E4", "E7", "E9", "F", "I", "SIM"]

[tool.ruff.lint.isort]
# `app` lives under backend/ and must be treated as first-party. Declaring it
# explicitly prevents isort from merging it with third-party imports (which is
# why the editor, anchored at the workspace root, reported false I001 warnings).
known-first-party = ["app", "tests"]

[tool.mypy]
# The Pydantic plugin teaches mypy that ``Field(default, ...)`` supplies a
# default value. Without it every Pydantic model constructed with partial kwargs
# is reported as "Missing named argument", which hides real type errors in the
# noise. `ignore_missing_imports` mirrors the flag the CI job already passes.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.uv]
package = false
