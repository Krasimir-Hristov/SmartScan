requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "supabase>=2.6.0",
    "python-dotenv>=1.0.1",
    "langchain",
